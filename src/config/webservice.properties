# Configuración del Web Service de Consentimientos
# Entidad Financiera S.A. - Plataforma de Gestión de Consentimiento

# URL base del servicio de consentimientos
webservice.baseUrl=

# Clave de API para autenticación
webservice.apiKey=

# Versión del cliente para headers
webservice.clientVersion=1.0.0

# Timeout para las peticiones (en milisegundos)
webservice.timeout=30000

# Número máximo de reintentos en caso de fallo
webservice.maxRetries=3

# Intervalo entre reintentos (en milisegundos)
webservice.retryInterval=1000

# Habilitar/deshabilitar el envío al web service
webservice.enabled=true

# URL del servicio para obtener IP del cliente
webservice.ipServiceUrl=

# Configuración de endpoints específicos
webservice.endpoints.submit=
webservice.endpoints.history=
webservice.endpoints.delete=

# Configuración de logging
webservice.logging.enabled=true
webservice.logging.level=info

# Configuración de headers adicionales
webservice.headers.contentType=application/json
webservice.headers.userAgent=fe-pgc/1.0.0

# Configuración de desarrollo/producción
webservice.environment=development
webservice.debug=true